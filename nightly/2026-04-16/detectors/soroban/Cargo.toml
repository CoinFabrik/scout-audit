[workspace]
exclude = [".cargo", ".vscode", "target"]
members = ["*"]
resolver = "2"

[workspace.dependencies]
clippy_utils = { git = "https://github.com/rust-lang/rust-clippy", rev = "84bb31a36d0df59768829821b068d80da455a7b4", package = "clippy_utils" }
common = { path = "../../common" }
common_detectors = { path = "../../common/detectors", package = "common-detectors" }
dylint_internal = "5.0.0"
dylint_linting = { git = "https://github.com/trailofbits/dylint.git", rev = "d367947a11f17048e1c73ced41851e906e3648fa" }
if_chain = "1.0.2"
itertools = "0.13"
